name: Test Cancel Stale PR Runs

# Fork 격리 검증용: update branch(synchronize)가 만든 새 head에서 같은 PR의 이전 SHA run만 취소한다.
# pull_request_target은 base workflow를 사용하고 write token을 얻으므로, PR head checkout·script 실행은 금지한다.
on:
  pull_request_target:
    types: [synchronize]

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    if: github.event.pull_request.base.ref == 'test/ci-concurrency-base-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older pull-request runs for this head branch
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const currentSha = pull.head.sha;
            const activeStatuses = new Set([
              'queued', 'in_progress', 'pending', 'requested', 'waiting',
            ]);
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                branch: pull.head.ref,
                event: 'pull_request',
                per_page: 100,
              },
            );
            const staleRuns = runs.filter(
              (run) => run.head_sha !== currentSha && activeStatuses.has(run.status),
            );
            for (const run of staleRuns) {
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              core.info(`Cancelled stale run ${run.id} (${run.name}, ${run.head_sha}).`);
            }
            core.info(`Current head ${currentSha}; cancelled ${staleRuns.length} stale run(s).`);
