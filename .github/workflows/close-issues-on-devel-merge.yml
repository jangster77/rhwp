name: Close Issues on devel Merge

on:
  pull_request_target:
    branches: [devel]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    name: Close linked issues
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}

    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const closingKeyword = /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s*/gi;
            const issueRef = /(?:https:\/\/github\.com\/([^/\s#]+)\/([^/\s#]+)\/issues\/(\d+)|(?:(\w[\w.-]*)\/([\w.-]+))?#(\d+))/gi;

            function collectIssueNumbers(text) {
              const numbers = new Set();
              const source = String(text || '');
              const lines = source.split(/\r?\n/);

              for (const line of lines) {
                closingKeyword.lastIndex = 0;
                let keywordMatch;

                while ((keywordMatch = closingKeyword.exec(line)) !== null) {
                  const clause = line.slice(keywordMatch.index + keywordMatch[0].length);
                  issueRef.lastIndex = 0;
                  let refMatch;

                  while ((refMatch = issueRef.exec(clause)) !== null) {
                    const refOwner = refMatch[1] || refMatch[4] || owner;
                    const refRepo = refMatch[2] || refMatch[5] || repo;
                    const number = Number(refMatch[3] || refMatch[6]);

                    if (
                      Number.isInteger(number) &&
                      refOwner.toLowerCase() === owner.toLowerCase() &&
                      refRepo.toLowerCase() === repo.toLowerCase()
                    ) {
                      numbers.add(number);
                    }
                  }
                }
              }

              return numbers;
            }

            const texts = [
              pr.title,
              pr.body,
            ];

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            for (const commit of commits) {
              texts.push(commit.commit.message);
            }

            const issueNumbers = new Set();
            for (const text of texts) {
              for (const number of collectIssueNumbers(text)) {
                issueNumbers.add(number);
              }
            }

            if (issueNumbers.size === 0) {
              core.info(`No closing issue references found for PR #${pr.number}.`);
              return;
            }

            for (const issue_number of [...issueNumbers].sort((a, b) => a - b)) {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number,
              });

              if (issue.state === 'closed') {
                core.info(`Issue #${issue_number} is already closed.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `PR #${pr.number} was merged into \`${pr.base.ref}\` and referenced this issue with a closing keyword. Closing this issue automatically.`,
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });

              core.info(`Closed issue #${issue_number} from PR #${pr.number}.`);
            }
